# Self-hosted deployment target (EC2, Phase 2). Vercel remains primary production.
# Builds the image directly from source on the host — no registry push yet
# (see docs/AWS_DEPLOYMENT_PLAN.md "Phase 2.1" for that follow-up).
services:
  app:
    image: shashank971/roadmap-ai:latest
    ports:
      - "3000:3000"
    env_file:
      - /opt/roadmap-ai/.env
    restart: unless-stopped
