name: SECRETS SCANNING

on:
  workflow_call:

jobs:
  secrets_scanning:
    runs-on: ubuntu-latest

    steps:

      # ---------------- CODE CHECKOUT ----------------
      - name: code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------- GITLEAKS ----------------
      - name: git leaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}