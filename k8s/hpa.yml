kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: hpa-frontend
  namespace: roadmap

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: roadmap-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
   - type: Resource
     resource:
        name: cpu 
        target: 
          type: Utilization
          averageUtilization: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10
      policies:
        - type: Pods 
          value: 1
          periodSeconds: 10
    scaleDown:
      stabilizationWindowSeconds: 20
      policies:
        - type: Pods
          value: 1
          periodSeconds: 10        